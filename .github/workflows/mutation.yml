# 変異テストの全部の測りと、テストの見直し。backend の app の関数の中を機械的に1か所ずつ書き換え（mutmut が作る変異。版と準備は .github/actions/mutmut）、
# 変異ごとに、その関数を通るテストを最後まで回して、どのテストが落ちたかを記録し、.claude/rules/testing.md「テストを変異テストで
# 見直す」の候補を出す（tasks#661）。回し方と結果の読み方は .claude/skills/test-review/SKILL.md。
#
# - 手で起こす（gh workflow run mutation.yml、または Actions → Mutation → Run workflow）。測る版と台本は、起こすときに
#   選んだ ref から読む（台本は backend/scripts/mutation/。台本を直すたびにこのファイルを変えずに済む）。測りは入力の issue の
#   レーンで動くので、本はその issue のほかのジョブ（担当の Pull Request の CI 等）と枠を分け合い、レーンより多い本は空くまで待つ
#   （レーンは docs/architecture/tech-stack.md「CIの実行枠」）。
# - 2段で回る:
#   1. shard（15本）: 変異と、テストの当たる関数ごとの基準（変異を入れずに同じテストを2回）を1つの無作為の並び（種を固定）に
#      して、行を順に配り、1本ずつ別のランナーで回す。1本の中ではテストDBを分けた4つの担い手で回す（CI の backend と同じ
#      arm64・4コアのランナー）。回し終えたら、その本の生き残りのうち読み込みのときに呼ばれうる関数の変異（importtime.py）に、
#      同じランナーでテスト全体を当て直す（読み込みのときに呼ばれうるかは関数ごとに決まるので、ほかの本の結果は要らない。
#      別の段にすると、変異の生成とランナーの空き待ちがもう1回ずつ要る）。
#   2. review（1本）: 1 を層に依らない表（Stryker の結果の JSON の形）にし（report.py）、その表から見直しの候補を出す
#      （review.py）。前の実行の見直し（成果物 mutation-review）を取ってきて比べ、前回も重なりの候補だったテストに印を付ける。
#      候補は消す一覧ではなく、1件ずつ壊れるものを書いてから決める（test-review/SKILL.md）。数の表は実行の要約に出す。
# - 測る版の backend/scripts/mutation/ に一覧（only.txt・recheck.txt・baseline.txt）があれば、1 はその一覧だけを回し（当て直しも
#   しない）、2 は走らない（消したあとの確かめ等。run-checks/SKILL.md「変異テストでテストの効きを測る」）。
# - 持ち時間: 2026-10-18 の測り（15本、実行 39099279906）で、1本あたり変異と基準（約1,710件）が61〜87分、当て直し（26〜42件）が
#   21〜72分、変異の生成が約4分で、1本は1時間28分〜2時間38分。本はレーンに3本ずつ載るので3巡して、実時間は約7時間25分
#   （review は1分未満）。担い手は始めて stop_after 分で新しい変異を取らずに抜け、当て直しは90分で抜けて、持ち時間（240分）の
#   前に結果を残す（この測りではどちらにも当たらずに回し切った）。
# - 成果物: 1 は mutation-<番号>・recheck-<番号>（14日）、2 は mutation-review（次の見直しが比べるので90日）。
name: Mutation

on:
  workflow_dispatch:
    inputs:
      issue:
        description: この測りを持つ置き場の issue の番号（同時に動かすジョブの数をその issue のレーンで数える）
        required: true
      ref:
        description: 測る版（台本も同じ版の backend/scripts/mutation/ から読む）
        required: true
        default: master
      count:
        description: 1本あたりに回す変異の数（0 で配られた分を全部。試しに少なく回すときに使う）
        required: true
        default: "0"
      stop_after:
        description: 1本の担い手が新しい変異を取るのをやめるまでの分（このあと当て直しに最長90分）
        required: true
        default: "120"

permissions:
  contents: read

concurrency:
  group: mutation
  queue: max

env:
  SHARDS: 15
  WORKERS: 4
  MUT_OUT: /tmp/mutation
  MUT_DB_PREFIX: mut_w

jobs:
  shard:
    concurrency:
      group: orch/tasks-${{ inputs.issue }}-lane-${{ matrix.lane }}
      queue: max
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        # 本をレーン 1〜5 へ順に振る。1回の測りが同時に取るのは、この issue のレーンの数まで。
        include:
          - { shard: 0, lane: 1 }
          - { shard: 1, lane: 2 }
          - { shard: 2, lane: 3 }
          - { shard: 3, lane: 4 }
          - { shard: 4, lane: 5 }
          - { shard: 5, lane: 1 }
          - { shard: 6, lane: 2 }
          - { shard: 7, lane: 3 }
          - { shard: 8, lane: 4 }
          - { shard: 9, lane: 5 }
          - { shard: 10, lane: 1 }
          - { shard: 11, lane: 2 }
          - { shard: 12, lane: 3 }
          - { shard: 13, lane: 4 }
          - { shard: 14, lane: 5 }
    defaults:
      run:
        working-directory: backend
    outputs:
      full: ${{ steps.mode.outputs.full }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - id: mode
        name: 全部の測りか、一覧だけか
        run: |
          full=$(python3 -c 'import os, sys; sys.path.insert(0, "scripts/mutation"); from _shared import LISTS; print(str(not any(map(os.path.exists, LISTS))).lower())')
          echo "full=$full" >> "$GITHUB_OUTPUT"
      # 本番と同じ版を PostgreSQL 公式の apt リポジトリから入れる。取得が詰まると、ジョブの上限まで止まり続けた（2026-10-10 の
      # 試しで1本が37分止まった）ので、上限を付けて落とし、落ちた本だけをやり直す（test-review/SKILL.md の3）。
      # 担い手ごとのテストDBも作る。
      - uses: ./.github/actions/postgis
        timeout-minutes: 10
        with:
          copies: ${{ env.WORKERS }}
          copy-prefix: ${{ env.MUT_DB_PREFIX }}
      - uses: ./.github/actions/mutmut
        with:
          baseline: "1"
      - name: 変異と基準を分ける
        working-directory: backend/mutants
        env:
          SHARD: ${{ matrix.shard }}
          COUNT: ${{ inputs.count }}
        run: |
          awk -v s="$SHARD" -v n="$SHARDS" '(NR - 1) % n == s' "$MUT_OUT/all.txt" > "$MUT_OUT/shard.txt"
          if [ "$COUNT" -gt 0 ]; then head -n "$COUNT" "$MUT_OUT/shard.txt" > "$MUT_OUT/shard.tmp" && mv "$MUT_OUT/shard.tmp" "$MUT_OUT/shard.txt"; fi
          echo "この本で回す変異と基準: $(wc -l < "$MUT_OUT/shard.txt") 件"
      - name: 回す
        working-directory: backend/mutants
        env:
          STOP_AFTER_MINUTES: ${{ inputs.stop_after }}
        run: |
          MUT_STOP_AFTER=$((STOP_AFTER_MINUTES * 60)) python ../scripts/mutation/runner.py "$MUT_OUT/shard.txt" "$MUT_OUT/results.jsonl" "$WORKERS"
          cp mutmut-stats.json "$MUT_OUT/"
      - name: 読み込みのときに呼ばれうる関数の生き残りに、テスト全体を当て直す
        if: steps.mode.outputs.full == 'true'
        env:
          RECHECK_OUT: /tmp/recheck
        run: |
          mkdir -p "$RECHECK_OUT"
          recheck=$(python3 -c 'import sys; sys.path.insert(0, "scripts/mutation"); from _shared import RECHECK_LIST; print(RECHECK_LIST)')
          python scripts/mutation/importtime.py "$MUT_OUT/results.jsonl" "$recheck"
          cd mutants
          MUT_OUT="$RECHECK_OUT" MUT_STOP_AFTER=5400 python ../scripts/mutation/runner.py "$recheck" "$RECHECK_OUT/results.jsonl" "$WORKERS"
      - if: always() && steps.mode.outputs.full == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: recheck-${{ matrix.shard }}
          path: |
            /tmp/recheck/results.jsonl
            /tmp/recheck/kills/
          retention-days: 14
          if-no-files-found: warn
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-${{ matrix.shard }}
          path: |
            /tmp/mutation/results.jsonl
            /tmp/mutation/shard.txt
            /tmp/mutation/rows.json
            /tmp/mutation/mutmut-stats.json
            /tmp/mutation/kills/
          retention-days: 14
          if-no-files-found: warn

  review:
    needs: shard
    if: needs.shard.outputs.full == 'true'
    concurrency:
      group: orch/tasks-${{ inputs.issue }}-lane-1
      queue: max
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/python
      - uses: actions/download-artifact@v8
        with:
          pattern: mutation-*
          path: /tmp/art
      - uses: actions/download-artifact@v8
        with:
          pattern: recheck-*
          path: /tmp/rart
      - name: 前の実行の見直しを取る
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/prev
          # 一覧が成果物の ID まで返すので、ID で取る（gh run download はその実行の成果物を一覧し直してから取る）。
          prev=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=mutation-review&per_page=30" \
            -q '[.artifacts[] | select(.expired | not) | select(.workflow_run.id != ${{ github.run_id }})][0] // empty | "\(.id) \(.workflow_run.id)"')
          if [ -n "$prev" ]; then
            gh api "repos/${{ github.repository }}/actions/artifacts/${prev% *}/zip" > /tmp/prev.zip
            unzip -q /tmp/prev.zip -d /tmp/prev
            echo "前の見直し: 実行 ${prev#* }"
          else
            echo "前の見直しは無い（前回も候補だった印は付かない）"
          fi
      - id: review
        name: 集計して見直す
        run: |
          mkdir -p /tmp/review
          mkdir -p /tmp/rart
          python scripts/mutation/report.py /tmp/art /tmp/rart /tmp/review/report.json
          python scripts/mutation/review.py /tmp/review/report.json /tmp/prev /tmp/review
          cat /tmp/review/summary.md >> "$GITHUB_STEP_SUMMARY"
      # 変異を全部回し終えた測りの見直しだけを残す（途中で止まった測り・count で減らした試しを、次の見直しが前回として
      # 読まないように）。見直しが落ちたときも残さない。
      - if: steps.review.outputs.complete == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mutation-review
          path: /tmp/review/
          retention-days: 90
          if-no-files-found: warn
