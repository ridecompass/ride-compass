# 担当（実装・検証）を1件、GitHub Actions のランナーで動かす。見回りが振り出す（tools/flow-gate/src/patrol.js）。手でも起こせる:
#   gh workflow run claude-task.yml -R ridecompass/ride-compass -f issue=<置き場の issue の番号> -f kind=<実装|検証>
# 担当は .claude/skills/task-work/SKILL.md の冒頭と自分の担当の節の手順を進め、ステータスは書かない（実行の始まりと終わりの出来事で、ゲートが決める）。
# このワークフローを無効にすると、見回りは振り出さない（止める操作）。リポジトリは公開なので、担当の出力の全文は記録に出さない。
name: Claude Task
# 見回りは、この名前からどのタスクのどの担当の、どの振り出しの実行かを読む（tools/flow-gate/src/facts.js: runOf）。
run-name: "#${{ inputs.issue }} ${{ inputs.kind }} ${{ inputs.key }}"

on:
  workflow_dispatch:
    inputs:
      issue:
        description: 置き場（tools/flow-gate/flow.config.json の tasks）の issue の番号
        required: true
      kind:
        description: 担当の種類
        required: true
        type: choice
        options: [実装, 検証]
      key:
        description: 振り出しの識別子（見回りが付ける。手で起こすときは空でよい）
        required: false

permissions:
  contents: read

# 1つのタスクの担当は1人。同じ issue の実行は、取り消さずに順に動く。
concurrency:
  group: claude-task-${{ inputs.issue }}
  queue: max

jobs:
  task:
    # 担当だけが使うレーン（docs/architecture/tech-stack.md「CIの実行枠」）。
    concurrency:
      group: orch/tasks-${{ inputs.issue }}-lane-0
      queue: max
    # backend のテストを CI と同じ aarch64・同じ PostgreSQL + PostGIS で流す。
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      # 置き場へは hidakagit-bot、コードのリポジトリの gh は hidakagit の名義（GITHUB_TOKEN のマージは master の CI とデプロイを起こさない）。
      FLOW_BOT_TOKEN: ${{ secrets.FLOW_BOT_TOKEN }}
      GH_TOKEN: ${{ secrets.CODE_TOKEN }}
      MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
      ISSUE: ${{ inputs.issue }}
      KIND: ${{ inputs.kind }}
      # 担当は最初の結果で終わる。裏の処理（run_in_background・裏の subagent）は外す。
      CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
      # 担当の手番の間はほとんど数秒なので、キャッシュは単価の低い5分の保持で足りる（購読の既定は1時間）。
      CLAUDE_CODE_PROMPT_CACHE_TTL: 5m
      # 毎手番に文脈の全体を読み直すので、長い実行は窓の既定（モデルの文脈の窓）より早く要約して文脈を抑える。
      CLAUDE_CODE_AUTO_COMPACT_WINDOW: "200000"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.CODE_TOKEN }}
      # 置き場の名前は tools/flow-gate/flow.config.json の tasks だけが持つ。後の段は TASKS を、担当への指示は段の出力を読む。
      # 後片付けの道具（.github/claude-task/after.js と、それが読む流れの道具 tools/flow-gate/src と、src を ES モジュールとして読ませる package.json）は、
      # 担当が作業ツリーを変えても振り出された版で動くよう、ここで写して後の段はそれを打つ。
      - id: tasks
        run: |
          tasks=$(jq -er .tasks tools/flow-gate/flow.config.json)
          echo "TASKS=$tasks" >> "$GITHUB_ENV"
          echo "repo=$tasks" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/flow" && cp -r .github/claude-task tools/flow-gate/src tools/flow-gate/package.json "$RUNNER_TEMP/flow/"
          echo "FLOW_SRC=$RUNNER_TEMP/flow/src" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: ./.github/actions/postgis
      # Read が PDF をページで読むときの pdftoppm（apt の一覧は postgis の段が更新してある）。
      - run: sudo apt-get install -y --no-install-recommends poppler-utils
      - uses: ./.github/actions/python
        with:
          requirements: requirements-batch.txt requirements-dev.txt
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: git config --global user.name hidakagit && git config --global user.email 6731891+hidakagit@users.noreply.github.com
      # 担当が issue を読み始める時刻と、その時点の本文。終わりのコメントに読み始めとその時点の完了の条件を写し、ゲートはこれより後のユーザーの文を
      # まだ読まれていない文として扱い、状態を動かさずに終えた担当がその実行で約束を動かしたかを決める（.github/claude-task/after.js）。
      - env:
          GH_TOKEN: ${{ secrets.FLOW_BOT_TOKEN }}
        run: |
          echo "READ_FROM=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          gh issue view "$ISSUE" -R "$TASKS" --json body -q .body > "$RUNNER_TEMP/start.md"
      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.CODE_TOKEN }}
          # 担当はゲートの App が起こす。連携は、名前を挙げていないボットが起こした実行を断る。
          allowed_bots: ridecompass-gate
          # 担当の権限（連携がランナーのユーザー設定へ書く。判定役はユーザー設定の autoMode を読む）。
          settings: ${{ github.workspace }}/.github/claude-task/settings.json
          claude_args: --model ${{ inputs.kind == '検証' && 'claude-sonnet-5-5' || 'claude-opus-5-5' }} --disallowedTools Monitor,ScheduleWakeup,CronCreate,CronDelete,CronList,Workflow
          prompt: |
            あなたは RideCompass の${{ inputs.kind }}担当です。作業ツリー ${{ github.workspace }} で、置き場 ${{ steps.tasks.outputs.repo }} の issue #${{ inputs.issue }} を扱います。
            まず CLAUDE.md と、.claude/skills/task-work/SKILL.md のうち冒頭と「${{ inputs.kind }}担当」の節を `awk -v k='**${{ inputs.kind }}担当**' '/^\*\*(実装|検証)担当\*\*/{s=(index($0,k)!=1)} /^\*\*競合を解く\*\*/{s=0} !s' .claude/skills/task-work/SKILL.md` で読み、その手順のとおりに進めてください。
      # 実装担当の GitHub に無い変更は、ランナーと一緒に消えないよう wip の枝へ残す（作業ブランチは書き換えない）。
      - if: always() && inputs.kind == '実装'
        run: |
          [ -z "$(git status --porcelain)" ] || { git add -A && git commit -q -m "tasks#${ISSUE}: 作業途中（実装担当の終わりに残った未コミットの変更）"; }
          git fetch -q origin
          if [ -z "$(git branch -r --contains HEAD)" ]; then git push -q origin "HEAD:refs/heads/wip/tasks-${ISSUE}-$(date -u +%Y%m%dT%H%M%SZ)"; fi
      # 手番の記録（実行のファイル）を非公開の置き場の日（UTC）ごとのリリースへ置き、issue に終わりを書く（.github/claude-task/after.js）。
      # 1つのリリースに付けられるのは1000件まで（公式の文書「About releases」）。並んで作ると後のほうは作れないので、作られたものへ付ける。
      # リリースは日の初めの1回だけ作るので、先に付けてみて、リリースが無かったときだけ作ってから付け直す（ほかの理由で落ちたら
      # 打ち直さない）。終わりは REST で書けば1回で済む（gh issue comment は issue の ID を引く1回と書く1回を打つ）。
      - if: always()
        env:
          GH_TOKEN: ${{ secrets.FLOW_BOT_TOKEN }}
          # 連携が書き出す実行のファイル。担当が起きる前に落ちたときは無い。
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file || format('{0}/claude-execution-output.json', runner.temp) }}
        run: |
          TAG="turns-$(date -u +%F)"; NAME="tasks-$ISSUE-$GITHUB_RUN_ID.json.gz"; LOG=""
          if [ -f "$EXECUTION_FILE" ] && gzip -c "$EXECUTION_FILE" > "$RUNNER_TEMP/$NAME"; then
            if ! err=$(gh release upload "$TAG" "$RUNNER_TEMP/$NAME" -R "$TASKS" 2>&1); then
              case "$err" in
                *"release not found"*)
                  gh release create "$TAG" -R "$TASKS" --title "担当の手番の記録 ${TAG#turns-}" --notes "" || true
                  gh release upload "$TAG" "$RUNNER_TEMP/$NAME" -R "$TASKS" ;;
                *) echo "$err" >&2; false ;;
              esac
            fi && LOG="https://github.com/$TASKS/releases/download/$TAG/$NAME"
          fi
          node "$RUNNER_TEMP/flow/claude-task/after.js" "$KIND" "$EXECUTION_FILE" "$LOG" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "$RUNNER_TEMP/start.md" > "$RUNNER_TEMP/end.md"
          gh api "repos/$TASKS/issues/$ISSUE/comments" -F "body=@$RUNNER_TEMP/end.md" --silent
      # 担当が Claude の利用の上限・認証で止まったら、この段が落ちる。ゲートはこの段の名前（flow.config.json: quotaStep）で読み、振り出しを止める。
      - name: 利用の上限で止まった
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file || format('{0}/claude-execution-output.json', runner.temp) }}
        run: node "$RUNNER_TEMP/flow/claude-task/after.js" --quota "$EXECUTION_FILE"
