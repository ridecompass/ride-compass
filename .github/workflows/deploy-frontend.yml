# frontendをRenderへデプロイする。
#
# CIを通ったコミットのfrontendの像（ci.ymlのfrontend-imageが作り、e2eと全状態の走査が中身を試してGitHubのコンテナの
# 置き場へ置いたもの）を、Renderのデプロイフックに`imgURL`で渡して出させる。手動の起動では、ここで像を作って置く。Renderではビルドしない（無料のプランのビルドの時間は月500分で、使い切るとその月は出せない）。
# Renderの自動デプロイは使わない——「After CI Checks Pass」は連携したブランチの最新のコミットだけを、そのコミットの
# チェックが全部終わってから出すため、masterの先頭に長く動くチェック（workflow_dispatchで動く実行）が付いている間は何も出ない。
name: Deploy Frontend to Render

on:
  # ci.ymlが、masterへのpushでCIの全ジョブが通ったあとに呼ぶ（どれかが赤なら呼ばれない）。
  # 呼ばれたときの`github.sha`は、CIを通ったそのコミット。
  workflow_call:
  # 手動のデプロイ。CIを待たず、選んだrefの先端から像を作ってそのまま出す。
  workflow_dispatch:

# 像をGitHubのコンテナの置き場へ置く。ci.ymlから呼ばれるときは、呼ぶ側のジョブが渡した権限が上限になる。
permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # 判定・デプロイ・反映の待ちを1つのジョブにし、まとめて1本ずつ走らせる。Renderは最後に頼まれたデプロイを
    # 出すので、反映を待たずに次の判定へ進むと、後から終わった古いCIの実行が新しいコミットを上書きしうる。どの ref から起こしても
    # 本番（公開先）は1つなので、レーンの鍵は master に決めてある（レーンは docs/architecture/tech-stack.md「CIの実行枠」）。
    concurrency:
      group: master-lane-4
      queue: max
    env:
      # Renderのサービスに設定した像のURLと、タグ以外が同じでなければならない（フックが断る）。
      IMAGE: ghcr.io/${{ github.repository_owner }}/ride-compass-frontend
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: echo "VERSION_URL=$(jq -r .frontend production-origins.json)/api/version" >> "$GITHUB_ENV"
      - name: 本番で動いているコミットを読む
        id: deployed
        run: |
          # 休止から起き上がる間は429・5xxが返るので、少し待って読み直す。読めなければ空のまま進む
          # （判定は「分からないので出す」になる）。
          sha=$(curl -fsS --max-time 30 --retry 6 --retry-all-errors --retry-delay 10 "$VERSION_URL" | jq -r '.commit // empty') || sha=""
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: 出すかを決める
        id: gate
        env:
          DEPLOYED: ${{ steps.deployed.outputs.sha }}
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "出す: 手動の起動"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            python3 backend/scripts/deploy_gate.py --any-change "$DEPLOYED" "$GITHUB_SHA"
          fi
      - name: このコミットの像を用意する
        if: steps.gate.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if [ "${{ github.event_name }}" != workflow_dispatch ]; then
            # ci.yml の frontend-image が、e2e と全状態の走査が試した中身の像を置いてある。作り直さずにそれを出す。
            docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" > /dev/null \
              || { echo "::error::ci.yml の frontend-image が置いた像 $IMAGE:$GITHUB_SHA が置き場に無い"; exit 1; }
            exit 0
          fi
          node frontend/scripts/image.mjs "$IMAGE:$GITHUB_SHA" "$GITHUB_SHA"
          docker push "$IMAGE:$GITHUB_SHA"
      - name: Renderのデプロイフックでこの像を出す
        if: steps.gate.outputs.deploy == 'true'
        env:
          HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::リポジトリの秘密 RENDER_FRONTEND_DEPLOY_HOOK_URL が無い"
            exit 1
          fi
          # フックのURLは鍵を`?key=`で持つので、`imgURL`は`&`で足す。200は今始まった、202は進行中のデプロイの後に始まる。
          img=$(jq -rn --arg v "$IMAGE:$GITHUB_SHA" '$v | @uri')
          code=$(curl -sS --max-time 60 -o "$RUNNER_TEMP/hook.json" -w '%{http_code}' -X POST "$HOOK&imgURL=$img") || code=000
          echo "デプロイフックの応答 $code $(cat "$RUNNER_TEMP/hook.json" 2>/dev/null)"
          case "$code" in
            200|202) ;;
            *) exit 1 ;;
          esac
      - name: 本番の/api/versionがこのコミットになるまで待つ
        if: steps.gate.outputs.deploy == 'true'
        run: |
          # 上限までに変わらなければ、Renderの像の取得か起動が失敗している（ダッシュボードの Events に出る）。
          WAIT_SECONDS=1800
          WAIT_STARTED=$SECONDS
          until [ "$(curl -fsS --max-time 30 "$VERSION_URL" 2>/dev/null | jq -r '.commit // empty' 2>/dev/null)" = "$GITHUB_SHA" ]; do
            if [ $((SECONDS - WAIT_STARTED)) -ge $WAIT_SECONDS ]; then
              echo "::error::本番の/api/versionが${WAIT_SECONDS}秒以内にこのコミットになりませんでした commit=$GITHUB_SHA"
              curl -sS --max-time 30 "$VERSION_URL" || true
              exit 1
            fi
            sleep 30
          done
          echo "本番の/api/versionがこのコミットになるまで $((SECONDS - WAIT_STARTED))秒 commit=$GITHUB_SHA"
