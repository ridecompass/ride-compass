# Pull Request の変えた関数の変異テスト（tasks#728）。Pull Request が backend の実装を変えたとき、変えた行を含む関数の変異だけを
# 回し、テストが気づかない変異（生き残り）を、変えた行への注記と実行の要約で知らせる。必須のチェックにしない（知らせるだけで、
# マージを止めない）。
#
# - 変異の生成と、関数ごとに通るテストの記録は全体で行う（記録が無いと、どのテストを回すかが決まらない）。回すのは、
#   差分で変わった関数の変異と、その関数の基準（変異を入れずに同じテストの組み合わせを2回）だけ。台本は backend/scripts/mutation/
#   （diff_scope.py・pr_plan.py・runner.py・report_pr.py）。
# - 比べる版は、checkout した Pull Request と master を合わせた版の master の側の親（.github/actions/pr-base）。
# - 持ち時間: 回す数は変えた関数しだいで、担い手はジョブの始まりから MUT_RUN_UNTIL 秒を過ぎたら新しい変異を取らずに抜ける。
#   ジョブの始まりから数えるのは、生成と記録の長さが変わっても、抜けたあと回しかけの変異を終えて結果を残す間を
#   timeout-minutes の前に残すため。
name: Mutation PR

on:
  pull_request:
    paths:
      - "backend/app/**"
      - "backend/scripts/mutation/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changed-functions:
    concurrency:
      group: ${{ github.head_ref || github.ref_name }}-lane-5
      queue: max
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    env:
      WORKERS: 4
      MUT_OUT: /tmp/mutation
      MUT_DB_PREFIX: mut_w
      MUT_RUN_UNTIL: "2700"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: base
        uses: ./.github/actions/pr-base
      - name: 変えた関数
        id: scope
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          echo "MUT_JOB_START=$(date +%s)" >> "$GITHUB_ENV"
          mkdir -p "$MUT_OUT"
          python3 scripts/mutation/diff_scope.py "$BASE" > "$MUT_OUT/funcs.txt"
          echo "変えた関数: $(grep -c . "$MUT_OUT/funcs.txt" || true)"
          if [ -s "$MUT_OUT/funcs.txt" ]; then echo "any=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.scope.outputs.any == 'true'
        uses: ./.github/actions/postgis
        with:
          copies: ${{ env.WORKERS }}
          copy-prefix: ${{ env.MUT_DB_PREFIX }}
      - if: steps.scope.outputs.any == 'true'
        uses: ./.github/actions/mutmut
      - if: steps.scope.outputs.any == 'true'
        name: 変えた関数の変異を回す
        working-directory: backend/mutants
        run: |
          python ../scripts/mutation/pr_plan.py "$MUT_OUT/funcs.txt"
          MUT_STOP_AFTER=$((MUT_JOB_START + MUT_RUN_UNTIL - $(date +%s))) python ../scripts/mutation/runner.py "$MUT_OUT/all.txt" "$MUT_OUT/results.jsonl" "$WORKERS"
      - if: steps.scope.outputs.any == 'true'
        name: 生き残りを知らせる
        run: python scripts/mutation/report_pr.py "$BASE"
      - if: always() && steps.scope.outputs.any == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mutation-pr
          path: |
            /tmp/mutation/results.jsonl
            /tmp/mutation/all.txt
            /tmp/mutation/scope.json
            /tmp/mutation/kills/
          retention-days: 14
          if-no-files-found: warn
