# CI。masterへのpushとPull Requestごとに、変更が届きうるbackend・frontendの検査を回す。
#
# - backend: ruff（lint）→ mypy（型検査）→ pytest（PostGIS統合テスト込み）。PostGIS統合テスト（tests/conftest.py の
#   road_graph_session）は、ランナーへ直接入れたPostgreSQL＋PostGIS + TEST_DATABASE_URL 注入で実行する。
# - api-contract: API契約のドリフト検知。DBを読まないため、postgresを持たない別ジョブにして
#   backendジョブと並べて走らせる。
# - frontend: prettier → eslint → knip → tsc --noEmit → vitest の順。書式・lint・型エラーは実行の速い順に
#   先へ置き、失敗を早く返す。knipは本番・テスト・e2eの入口から辿れないファイル・export・依存を見る。
# - 段: 軽い検査（backend・api-contract・frontend・scripts・frontend-image・backend-image と、置き場に依らない
#   docs-consistency・doc-reading-tests・repo-wide・flow-gate）を段1として並べて走らせ、
#   重い検査（e2e）は段1のどれも落ちず・取り消されずに終わったときだけ始める。落ちた版の残りにランナーを使わない。
# - e2e: frontend-image が作った本番の像の中のアプリを実ブラウザで開き、実機でしか出ないもの（収まる・押せる、ブラウザと地図の
#   実挙動、カスケード）を見る（対象の定義は .claude/rules/testing-e2e.md パターン4）。
#   バックエンド・外部APIには依存せず、frontend/e2e/fixtures.tsのネットワークモックで置き換える
#   （API契約の正しさはapi-contractジョブが別途担保）。像は本番のbackendの宛先を焼き込むので、モックはその宛先へ当て、
#   モックの無い要求はブラウザの外へ出さない。
#   e2eは、Playwrightの公式のcontainerのimage（ブラウザとその依存を入れたもの）の中で走らせ、
#   ブラウザを取り込む段を持たない。imageの版は、changesがfrontend/package-lock.jsonの@playwright/testの版から
#   決める（版が違うとブラウザの実行ファイルが見つからない。公式の文書 https://playwright.dev/docs/docker ）。
#   @playwright/testを上げる変更（Dependabot等）が、そのままimageも上げる。
# - frontend-image・backend-image: 本番の像を同じDockerfileで作り、起こせるかを見る（何を見るかは各ジョブの上）。
#   frontend-image が作った像は、中のアプリを e2e が試し、masterではその像をそのまま deploy-frontend が出す
#   （確かめた中身と出す中身を同じにする）。
# - scripts: 根の scripts/ の道具のテスト（scripts/tests/）。PostGIS も backend の依存も要らない。
# - docs-consistency・doc-reading-tests・repo-wide・flow-gate: どの置き場の変更でも毎回走らせる（文書だけ・ワークフローだけ・
#   タスク管理だけの変更も見る）。何を見るかは各ジョブの上。検知器は常に全件を見る（.claude/rules/fixing.md「検知器を足す条件は厳しい」）。
# - deploy-gate: master への push で、flow-gate が通ったら、ゲートと回答フォームを Cloudflare へ公開する（製品の検査は待たない）。
# - changes: 変わった置き場（backend/・frontend/・scripts/）から、どのジョブとデプロイを走らせるかを決める
#   （決め方は docs/architecture/tech-stack.md「CIの実行枠」）。
# - ci-ok: コードのリポジトリの必須チェックに置く1本。changes が成功し、ほかのジョブが changes の決めたとおりに
#   終わった（走らせるなら成功、飛ばすならスキップ）ときだけ通し、それ以外は落とす。通す形を列挙するのは、
#   GitHub Actions の障害でランナーが付かずに取り消されたジョブが、needs の結果に cancelled として渡らないことがあるため
#   （失敗・取り消しを探す形では、それを見逃して通した）。
#   （必須にするのをこの1本にまとめると、ジョブを足し引きしても必須チェックの設定を変えずに済む）。
#   タスクの流れのゲート（tools/flow-gate/）も、作業ブランチの検査の合否をこの1本の結論で読む（flow.config.json: checks）。
# - deploy-backend・deploy-frontend: masterへのpushで、changes が要ると決め、ci-ok が通ったときだけ、backend・frontendを
#   本番へ出す（出すかの判定と手順は deploy-backend.yml・deploy-frontend.yml）。**本番へ出る前の検査はこのワークフロー**で、
#   どれかが赤ならデプロイは起動しない。
# - 持ち時間（各ジョブの timeout-minutes）: 2026-10-07 に測った成功した実行（masterへのpushの直近20件と
#   Pull Requestの直近60件）の、ジョブごとの最長の所要の2倍を5分単位へ切り上げた値（e2e は組ごと。全状態の走査は幅のうち長いほう）。
#   frontend-image・backend-image は、2026-10-11 の試しの Pull Request の成功した実行（frontend-image 2件・backend-image 1件。
#   最長はそれぞれ61秒・42秒）から同じ決め方で決めた。e2e の WebKit は、2026-10-11 の作業ブランチの成功した実行1件（2分22秒。
#   像を広げずにビルドしていた形）から同じ決め方で決めた。
#   段1のジョブの持ち時間だけは、重い検査を始めるまでの待ちの予算として、2026-10-11 に測った成功した実行（Pull Requestの
#   直近60件とmasterへのpushの直近60件）の最長の1.3〜3.4倍を分単位へ切り上げた値に詰めてある（短いジョブほど、分単位の切り上げで倍率が大きくなる）。
#   docs-consistency・doc-reading-tests・repo-wide・flow-gate は、2026-10-14 に測った成功した実行（マージした Pull Request の
#   直近40件。最長はそれぞれ9秒・50秒・13秒・19秒）から同じ決め方で決めた。段1の検査が延びると、その分
#   だけ通る版の待ちが延びる。持ち時間で切られたら、上げる前に検査を速くするか段2へ移せないかを見て、上げるならその理由を
#   Pull Request の本文に書く。
#   段が止まったジョブ（playwright install が進まなくなった等）を既定の360分まで待たせず、取り消しで終わらせて、
#   実装担当・検証担当が流し直す（.claude/skills/task-work/SKILL.md「実装担当」の5）。成功する実行が切られるようになったら、同じ決め方で
#   測り直す。deploy-backend・deploy-frontend の持ち時間は、呼ばれる側の deploy-*.yml が持つ。
name: CI

on:
  push:
    # 作業ブランチ（orch/**）へのpushでは走らせない。masterへ入れてよいかはPull Requestの実行
    # （masterと合わせた版）で決める。
    branches: [master]
  # ワークフローはいつも起こし、どのジョブを走らせるかは changes ジョブが変更されたパスから決める
  # （必須チェックは、ワークフローごと飛ばすと Pending のまま残り Pull Request がマージできない。
  # ジョブの if で飛ばしたものはスキップになり、必須チェックを通る。GitHub の公式の文書
  # 「Troubleshooting required status checks」）。
  # edited（題名・説明文の書き直し）でも全部を走らせ直す。説明文の形（flow-gate）は master のコミットの本文になるので、
  # 直したときも照らし、ci-ok の結論に入れる。
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

# 同じ ref（master・Pull Request ごと）の実行は1本ずつ動かし、待ちは一番新しい1件だけにする（既定の queue: single。
# 新しい実行が来ると古い待ちは取り消される。GitHub の公式の文書「Control the concurrency of workflows and jobs」）。
# 後のコミットは前の変更を全部含むので、古いコミットの実行は要らない。Pull Request は走っている実行も取り消し、
# master は走っている実行を最後まで走らせる（デプロイは同じ実行の中で走るので、途中で切らない）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    concurrency:
      group: ${{ github.head_ref || github.ref_name }}-lane-1
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # master と Pull Request の実行の一覧と、master のコミットを取り込んだ Pull Request を読む（下の BASE・tested）。
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      run: ${{ steps.diff.outputs.run }}
      playwright: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # e2e の container の image の版（上の e2e の説明）。
      - id: playwright
        run: |
          version=$(jq -er '.packages["node_modules/@playwright/test"].version' frontend/package-lock.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: base
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/pr-base
      # 各置き場は自分のテストを自分の中に持ち、置き場が変わったときだけその置き場の検査を走らせる。それ以外の変更
      # （文書・タスク管理・ほかのワークフロー等）では、置き場に依らないジョブ（docs-consistency 等）だけを走らせる。CI の定義（このファイル・.github/actions/）を変えたら、
      # 定義が変わったジョブだけを足して走らせ、ほかは置き場で決める（下の redefined）。ジョブどうしのつながりは、いつも走る
      # doc-reading-tests のワークフローを読むテストが見る。走らせるジョブの組はここだけが持ち（run）、ジョブの if と ci-ok が読む。
      - id: diff
        env:
          BASE: ${{ steps.base.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # master の push は、直前のコミット（github.event.before）でなく、master の祖先のうち push の実行が成功で
          # 終わった一番近いコミットと比べる。直前のコミットの実行が失敗で終わったか、待ちのまま取り消された
          # （concurrency）とき、その変更は検査もデプロイもされていないので、この実行の判定に入れる。
          # 一覧の並びは公式の文書に無いので、並びに頼らず祖先の側から辿る（見つからなければすべて走らせる）。
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            ok=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=master&event=push&status=success&per_page=100" --jq '.workflow_runs[].head_sha') || ok=""
            BASE=$(git rev-list --first-parent --skip=1 "$GITHUB_SHA" | awk 'NR == FNR { ok[$0] = 1; next } !found && ($0 in ok) { print; found = 1 }' <(printf '%s\n' "$ok") -)
            echo "比べる相手: ${BASE:-無し}"
          fi
          area() { grep -qE "$1" <<< "$changed" && echo true || echo false; }
          # コミットの CI の定義を、ジョブの名前ごとの中身の JSON で出す。中身は YAML として読んだもの（yq が JSON へ写したもの）
          # なので、コメントの行・行末のコメントだけの差は数えない。文字列の中の # と run のシェルの中のコメントは中身に残る。
          # ジョブが使う .github/actions/ の手順（手順が使う手順も）はジョブの中身に入れ、ジョブの外（on・concurrency 等）は名前 "" に置く。
          # 読めないファイルがあれば失敗で返す。
          definitions() {
            local f actions="{}" one
            for f in $(git ls-tree -r --name-only "$1" -- .github/actions/ | grep -E '/action\.ya?ml$'); do
              one=$(set -o pipefail; git show "$1:$f" | yq -o=json -I0 'explode(.)') || return 1
              actions=$(jq -c --arg k "./${f%/*}" --argjson v "$one" '. + {($k): $v}' <<< "$actions")
            done
            (set -o pipefail; git show "$1:.github/workflows/ci.yml" | yq -o=json -I0 'explode(.)') \
              | jq -c --argjson actions "$actions" '
                def used: [.. | objects | .uses? | strings | select(startswith("./.github/actions/"))];
                def closure: . as $p | ($p + [$p[] | $actions[.] | used[]] | unique) as $q | if $q == $p then $p else $q | closure end;
                (.jobs | map_values({job: ., actions: (used | unique | closure | map({key: ., value: $actions[.]}) | from_entries)}))
                  + {"": del(.jobs)}'
          }
          # 定義が変わったジョブの名前を JSON の配列で出す。変えたジョブが出力（needs.<ジョブ>.outputs）を読むジョブは、
          # 走らないと変えたジョブが動けないので足す。ジョブの外が変わった・読めないときは失敗で返し、すべて走らせる。
          redefined() {
            local a b
            a=$(definitions "$BASE") && b=$(definitions "$GITHUB_SHA") || return 1
            jq -ec --argjson a "$a" '. as $b
              | def feeds: . as $p | ($p + [$p[] | $b[.].job | tostring | scan("needs\\.([A-Za-z0-9_-]+)\\.outputs") | .[0]] | unique) as $q
                  | if $q == $p then $p else $q | feeds end;
              [($a + $b | keys[]) | select($a[.] != $b[.])] | if index("") then null else feeds - ["changes"] end' <<< "$b"
          }
          all=false; jobs='[]'
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}"; then
            # 比べる相手が無い（手での実行・成功した master の実行が見つからない）ときは、すべて走らせる。
            all=true
          else
            changed=$(git diff --name-only "$BASE" "$GITHUB_SHA")
            # 本番の宛先は、backend の像（CORS の許可）と frontend の像（埋め込む宛先）の両方が読む。
            backend=$(area '^(backend/|production-origins\.json$)'); frontend=$(area '^(frontend/|production-origins\.json$)'); scripts=$(area '^scripts/')
            if grep -qE '^\.github/(workflows/ci\.yml$|actions/)' <<< "$changed"; then
              jobs=$(redefined) || { all=true; jobs='[]'; }
              echo "定義が変わったジョブ: $([ "$all" = true ] && echo すべて || echo "$jobs")"
            fi
          fi
          if [ "$all" = true ]; then
            backend=true; frontend=true; scripts=true
          fi
          # 取り込んだ Pull Request の CI がこのコミットと同じ中身を検査済みなら、検査を回し直さず、像を作って出し直すだけにする。
          # Pull Request の CI は先頭へその時の master を合わせた版を検査する。先頭が直前の master（このコミットの親）を含み、
          # 先頭とこのコミットの木（ファイルの中身）が同じなら、合わせた版はこのコミットと同じ中身になる。CI の定義を変えたとき
          # （redefined）と、確かめられないとき（Pull Request が見つからない・取れない）は、回す。作業ブランチはマージで
          # 消えるので、先頭は Pull Request の ref から取る。比べる相手（BASE）が親でない（親の実行が成功していない）ときは、
          # 親までの変更を合わせた master をどの実行も検査し終えていないので、回す。
          tested=false
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$all" = false ] && [ "$jobs" = '[]' ] \
            && [ "$BASE" = "$(git rev-parse "$GITHUB_SHA^")" ]; then
            pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.merged_at != null)][0] // empty | "\(.number) \(.head.sha)"') || pr=""
            num=${pr%% *}; head=${pr#* }
            if [ -n "$pr" ] && git fetch --quiet --no-tags origin "refs/pull/$num/head" \
              && [ "$(git rev-parse FETCH_HEAD)" = "$head" ] \
              && git merge-base --is-ancestor "$GITHUB_SHA^" "$head" \
              && [ "$(git rev-parse "$head^{tree}")" = "$(git rev-parse "$GITHUB_SHA^{tree}")" ] \
              && [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$head&event=pull_request&status=success&per_page=1" --jq .total_count)" != 0 ]; then
              tested=true
            fi
            echo "取り込んだ Pull Request: ${num:-無し}・その CI で検査済みの中身: $tested"
          fi
          push=$([ "$GITHUB_EVENT_NAME" = push ] && echo true || echo false)
          # 検査済みのときも、frontend の像（出し直す像を置き場へ置く）・出し直し・ゲートの公開（flow-gate の後に走る）は走らせる。
          # docs-consistency・doc-reading-tests・repo-wide は if を持たずいつも走るので、ci-ok が突き合わせる組でもいつも true にする。
          # 定義が変わったジョブは、置き場が変わっていなくても走らせる（デプロイは master の push だけ）。
          run=$(jq -nc --argjson b "$backend" --argjson f "$frontend" --argjson s "$scripts" --argjson push "$push" --argjson t "$tested" \
            --argjson jobs "$jobs" \
            '($t | not) as $check
              | {backend: ($b and $check), "api-contract": (($b or $f) and $check), "backend-image": ($b and $check),
                frontend: ($f and $check), e2e: ($f and $check), "frontend-image": $f, scripts: ($s and $check),
                "deploy-backend": ($b and $push), "deploy-frontend": ($f and $push),
                "docs-consistency": true, "doc-reading-tests": true, "repo-wide": true, "flow-gate": true}
              | reduce ($jobs[] | select(IN("deploy-backend", "deploy-frontend") | not)) as $j (.; if has($j) then .[$j] = true else . end)
              | reduce ($jobs[] | select(IN("deploy-backend", "deploy-frontend"))) as $j (.; .[$j] = $push)')
          echo "$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: fromJSON(needs.changes.outputs.run)['backend']
    concurrency:
      group: ${{ github.head_ref || github.ref_name }}-lane-1
      queue: max
    # 本番（Oracle Cloud VMのAmpere A1）と同じaarch64・同じUbuntu 24.04で判定する。版の正本は
    # docs/architecture/tech-stack.md「DBの版」。
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/postgis
      # requirements-batch.txt（-r requirements.txtを内包し、取込バッチの依存を足す）を入れる。
      # 本番のイメージ（backend/Dockerfile）と同じ組で、tests/には取込バッチ（app/batch/）の
      # テストがあり無条件でosmiumをimportするため、requirements.txtだけでは収集で失敗する。
      - uses: ./.github/actions/python
        with:
          requirements: requirements-batch.txt requirements-dev.txt
      # lintはテストより先に置く（frontendジョブがeslint→tsc→vitestの順であるのと同じ、
      # 実行の速いものから）。設定はbackend/ruff.toml。対象はbackendの下のPythonすべてで、backendの外は
      # repo-wideジョブが見る。
      - run: python -m ruff check .
      # 関数の宣言と違う型の値を渡す呼び出しを止める。対象と設定はbackend/mypy.ini。
      - run: python -m mypy
      # 層の向き（上の層だけが下の層を読む）を止める。契約はbackend/.importlinter、各層が持つものは
      # docs/architecture/directory-layout.md。
      - run: lint-imports
      # -n auto（pytest-xdist）でCPUコア数ぶん並列化する。PostGIS統合テストは、ワーカーごとに TEST_DATABASE_URL の DB を
      # 複製した DB を使い、ファイルごとに1つのワーカーへ寄る（backend/tests/conftest.py: pytest_collection_finish）。
      # 実行順はpytest-randomlyがばらす。-qでは種が見出しに出ないため、runのIDを種に渡す——落ちた並びは
      # 手元で --randomly-seed=<runのID> を付けて同じ順に並べ直せる。
      - run: python -m pytest -q -n auto --dist loadgroup --randomly-seed=${{ github.run_id }}

  api-contract:
    needs: changes
    if: fromJSON(needs.changes.outputs.run)['api-contract']
    concurrency:
      group: ${{ github.head_ref || github.ref_name }}-lane-2
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 2
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      # export_openapi.pyはwebアプリの宣言だけをimportするため、取込バッチの追加依存は要らない。
      - uses: ./.github/actions/python
        with:
          requirements: requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # 差分が出た場合は、backendの宣言を変えたのに backend/scripts/export_openapi.py →
      # cd frontend && npm run generate:api の実行とコミットが漏れている。**生成物はすべてコードの宣言から決まり、DBを読まない**
      # ——軸定義はDBが正本で、実行時の GET /api/axis-catalog が配る。
      - run: python scripts/export_openapi.py
      - run: npm ci
        working-directory: frontend
      - run: npm run generate:api
        working-directory: frontend
      # working-directoryはリポジトリルートを明示する。ジョブ既定（backend）のままだと
      # pathspecが`backend/frontend/src/types/generated/`へ解決され、マッチ0件＝差分なしと
      # して常にexit 0になり、ドリフトを一切検知しない。
      - run: git diff --exit-code -- frontend/src/types/generated/
        working-directory: .

  frontend:
    needs: changes
    if: fromJSON(needs.changes.outputs.run)['frontend']
    concurrency:
      group: ${{ github.head_ref || github.ref_name }}-lane-2
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # 書式。設定はfrontend/.prettierrc.json・.prettierignore（生成物は外してある）。
      - run: npm run format:check
      - run: npm run lint
      # 入口（Next.jsの規約・vitest・Playwrightの設定・scripts）はknipが読み、足りない入口は frontend/knip.json が持つ。
      - run: npm run knip
      # LayoutProps等のNext.jsが生成するグローバル型（.next/types/、tsconfigのincludeに
      # 含まれる）を作る。ローカルはnext devの実行で自然に生成済みだが、CIのクリーン
      # チェックアウトには無く、無いままだとtscが「Cannot find name 'LayoutProps'」で
      # 失敗する。next typegenはフルビルドなしで型だけを生成する。
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test

  # 同じ像の中のアプリを、ブラウザと spec の組ごとに別のジョブで並べて走らせる。組を足すときは matrix の行を足す。
  # - Chromium: 全状態の走査を除くspec。
  # - WebKit: 全状態の走査を除くspec（走査は playwright.config.ts の webkit の project が外す）。
  # - 全状態の走査（frontend/e2e/all-states.spec.ts）: Chromiumで、幅ごとに段階（生成前・生成後・乗り換え後）の数の別のジョブ（--shard）。
  #   段階の所要は揃っている（2026-10-08 の成功した実行で desktop 35〜41秒ずつ）ので、1つのジョブに1段階ずつ割る。
  # 持ち時間（timeout）は組ごとに先頭の「持ち時間」の決め方で決める。レーン（lane）は、組が段1のレーン（1〜4）へ同じ数ずつ載るように振る。
  e2e:
    # 段1を全部待つ。置き場が変わらずに飛ばされた段1のジョブは、始めるのを止めない。
    needs: [changes, backend, api-contract, frontend, scripts, frontend-image, backend-image, docs-consistency, doc-reading-tests, repo-wide, flow-gate]
    if: "!cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && fromJSON(needs.changes.outputs.run)['e2e']"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: chromium, lane: 1, timeout: 50, args: '--project=chromium --grep-invert "全状態の走査"' }
          - { id: webkit, lane: 2, timeout: 5, args: "--project=webkit" }
          - { id: scan-mobile-1, lane: 3, timeout: 40, args: '--project=chromium -g "全状態の走査: mobile" --shard=1/3' }
          - { id: scan-mobile-2, lane: 4, timeout: 40, args: '--project=chromium -g "全状態の走査: mobile" --shard=2/3' }
          - { id: scan-mobile-3, lane: 1, timeout: 40, args: '--project=chromium -g "全状態の走査: mobile" --shard=3/3' }
          - { id: scan-desktop-1, lane: 2, timeout: 40, args: '--project=chromium -g "全状態の走査: desktop" --shard=1/3' }
          - { id: scan-desktop-2, lane: 3, timeout: 40, args: '--project=chromium -g "全状態の走査: desktop" --shard=2/3' }
          - { id: scan-desktop-3, lane: 4, timeout: 40, args: '--project=chromium -g "全状態の走査: desktop" --shard=3/3' }
    name: e2e (${{ matrix.id }})
    concurrency:
      group: ${{ github.head_ref || github.ref_name }}-lane-${{ matrix.lane }}
      queue: max
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.changes.outputs.playwright }}-noble
      # --user 1001 は公式の文書（https://playwright.dev/docs/ci の GitHub Actions の container の例）のとおり。
      # --ipc=host（Chromiumがメモリ不足で落ちない）と --init（PID 1 のプロセスの扱い）は https://playwright.dev/docs/docker が勧める。
      options: --user 1001 --ipc=host --init
    timeout-minutes: ${{ matrix.timeout }}
    env:
      # 起こすアプリ（下で広げる像の中身）と、それが焼き込んでいるbackendの宛先（モックを当てる先）。
      E2E_APP_DIR: ${{ github.workspace }}/app
      E2E_API_BASE: ${{ needs.frontend-image.outputs.api }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Playwright を動かすのに node_modules が要る。試すアプリはここではビルドしない。
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: frontend-app
      - run: tar -xzf frontend-app.tar.gz
        working-directory: .
      - run: npx playwright test ${{ matrix.args }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.id }}
          path: frontend/playwright-report/
          retention-days: 7
  # frontendの像を本番と同じDockerfileで作って起こし、サーバーがコンテナの外（公開した口）からも、コンテナの中の
  # 127.0.0.1からも応答するかを見る。本番の前段（Renderの転送）がコンテナのどの宛先へつなぐかはこちらで選べないので、
  # どちらかで届かなければ落とす（公開した口だけを見ると、コンテナの名前の宛先だけで待ち受けるサーバーも通る）。
  # 像は本番と同じ引数（backendの宛先を焼き込む）で作り、中のアプリを e2e へ渡し、masterでは GitHub のコンテナの
  # 置き場へ置いて deploy-frontend.yml に出させる。
  frontend-image:
    needs: changes
    if: fromJSON(needs.changes.outputs.run)['frontend-image']
    concurrency:
      group: ${{ github.head_ref || github.ref_name }}-lane-3
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      packages: write
    env:
      # deploy-frontend.yml が出す像の名前と同じ。
      IMAGE: ghcr.io/${{ github.repository_owner }}/ride-compass-frontend
    outputs:
      api: ${{ steps.build.outputs.api }}
    steps:
      - uses: actions/checkout@v5
      - name: 本番と同じ引数で像を作る
        id: build
        run: |
          echo "api=$(jq -r .backend production-origins.json)" >> "$GITHUB_OUTPUT"
          node frontend/scripts/image.mjs "$IMAGE:$GITHUB_SHA" "$GITHUB_SHA"
      # 起こす前のコンテナから取る（起こしたサーバーが書いたものを混ぜない）。
      - name: 像の中のアプリを取り出す
        shell: bash  # pipefail を付け、取り出しが落ちたら空の圧縮を成果物にせず段を落とす
        run: |
          docker create --name frontend-app "$IMAGE:$GITHUB_SHA"
          docker cp frontend-app:/app - | gzip -1 > frontend-app.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-app
          path: frontend-app.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - run: docker run --detach --name frontend-check --publish 3000:3000 "$IMAGE:$GITHUB_SHA"
      - name: コンテナの外と中から応答を見る
        run: |
          # 起動は本番で秒の単位で済む（Renderのログの Ready）。上限は起動が止まったときに待ち続けないためのもの。
          WAIT_SECONDS=60
          WAIT_STARTED=$SECONDS
          until curl -fsS --max-time 5 -o /dev/null http://localhost:3000/api/version; do
            if [ $((SECONDS - WAIT_STARTED)) -ge $WAIT_SECONDS ]; then
              echo "::error::コンテナの外から${WAIT_SECONDS}秒以内に/api/versionへ届かない"
              exit 1
            fi
            sleep 2
          done
          commit=$(curl -fsS --max-time 10 http://localhost:3000/api/version | jq -r .commit)
          if [ "$commit" != "$GITHUB_SHA" ]; then
            echo "::error::/api/versionのcommitが像に入れたコミットと違う（$commit）"
            exit 1
          fi
          curl -fsS --max-time 30 -o /dev/null http://localhost:3000/ || { echo "::error::コンテナの外からトップの画面が開けない"; exit 1; }
          docker exec frontend-check node -e "fetch('http://127.0.0.1:3000/api/version').then((r) => process.exit(r.ok ? 0 : 1), (e) => { console.error(e.cause ?? e); process.exit(1); })" \
            || { echo "::error::コンテナの中の127.0.0.1から/api/versionへ届かない（サーバーが全部の宛先で待ち受けていない）"; exit 1; }
      - name: masterでは像を置き場へ置く
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:$GITHUB_SHA"
      - if: failure()
        run: docker logs frontend-check
  # backendの像を本番と同じDockerfile・同じaarch64で作り、アプリを読み込めるかを見る（deploy-backend.ymlがコンテナを
  # 入れ替える前に見るのと同じ確かめを、マージの前に置く）。サーバーの起動はDBの軸定義を読むので、ここでは起こさない。
  backend-image:
    needs: changes
    if: fromJSON(needs.changes.outputs.run)['backend-image']
    concurrency:
      group: ${{ github.head_ref || github.ref_name }}-lane-3
      queue: max
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - run: docker build backend --tag backend-check
      - run: docker run --rm backend-check python -c "import app.main"
  scripts:
    needs: changes
    if: fromJSON(needs.changes.outputs.run)['scripts']
    concurrency:
      group: ${{ github.head_ref || github.ref_name }}-lane-4
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 2
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/python
        with:
          tools: pytest
      - run: python -m pytest -q
  # 文書の整合（scripts/review_checks.py docs）。pure pythonで数秒。
  docs-consistency:
    concurrency:
      group: ${{ github.head_ref || github.ref_name }}-lane-5
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/python
      - run: python scripts/review_checks.py docs
  # 全ての文書（と、持ち主の値の写しを照らすときはほかの追跡しているファイル）と、ワークフローを読むbackendのテスト。
  # 文書だけ・ワークフローだけの変更では backend ジョブが走らないので、ここで回す。
  doc-reading-tests:
    concurrency:
      group: ${{ github.head_ref || github.ref_name }}-lane-5
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 2
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      # tests/conftest.py と pytest.ini が読む依存（requirements-dev.txt が requirements.txt を内包する）。
      - uses: ./.github/actions/python
        with:
          requirements: requirements-dev.txt
      - run: python -m pytest -q tests/structure/test_named_references.py tests/structure/test_single_owner_values.py tests/structure/test_workflow_lanes.py
  # 運用の道具（backendの外のPython・追跡しているsh）の静的検査。
  repo-wide:
    concurrency:
      group: ${{ github.head_ref || github.ref_name }}-lane-5
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/python
        with:
          tools: ruff
      # backendの外のPythonすべて。backendの下はbackendジョブが見る。設定ファイルが無いので
      # ruffの既定のルールで見る（backend/ruff.tomlが選ぶものと同じ）。構文の誤りもruffが出す。
      - run: ruff check --extend-exclude backend .
      # 追跡しているshの構文。
      - run: git ls-files -z '*.sh' | xargs -0 -n1 bash -n
  # タスクの流れのゲート（tools/flow-gate/）の lint と、Pull Request の本文の形（本文は master のコミットになるので、
  # 直したときも照らす。上の on の edited）。
  flow-gate:
    concurrency:
      group: ${{ github.head_ref || github.ref_name }}-lane-2
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/flow-gate/package-lock.json
      - run: npm ci && npm run lint
        working-directory: tools/flow-gate
      # Dependabot の PR はマージしない（同じ版を取り込んだタスクが閉じる）ので照らさない。本文は環境変数で渡す（シェルに読ませない）。
      - if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$BODY" > "$RUNNER_TEMP/pr-body.md" && node scripts/pr-body.js "$RUNNER_TEMP/pr-body.md"
  ci-ok:
    needs: [changes, backend, api-contract, frontend, e2e, frontend-image, backend-image, scripts, docs-consistency, doc-reading-tests, repo-wide, flow-gate]
    if: always()
    concurrency:
      group: ${{ github.head_ref || github.ref_name }}-lane-4
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<< "$NEEDS"
          jq -e '(.changes.outputs.run // "null" | fromjson) as $run
            | .changes.result == "success" and $run != null
              and (del(.changes) | to_entries | all(.value.result == ($run[.key] | if . == true then "success" elif . == false then "skipped" else null end)))' <<< "$NEEDS"
  # どちらも、changes が決めたときだけ呼ぶ（ci-ok を待つので、この実行の検査が全部決めたとおりに終わってから）。
  # 状態の関数（!cancelled()）を外すと、ci-ok が needs する飛ばされたジョブを受けてデプロイも飛ばされるので、
  # ci-ok の結果を条件に書く（公式の文書 Workflow syntax の jobs.<job_id>.needs）。
  deploy-backend:
    needs: [changes, ci-ok]
    if: "!cancelled() && github.event_name == 'push' && needs.ci-ok.result == 'success' && fromJSON(needs.changes.outputs.run)['deploy-backend']"
    uses: ./.github/workflows/deploy-backend.yml
    secrets: inherit
  deploy-frontend:
    needs: [changes, ci-ok]
    if: "!cancelled() && github.event_name == 'push' && needs.ci-ok.result == 'success' && fromJSON(needs.changes.outputs.run)['deploy-frontend']"
    # 呼ばれた側は手動の起動のときに像を置くので、書く権限を宣言している。呼ばれた側が宣言する権限は、ここで渡した
    # 権限を超えると実行が断られる。
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy-frontend.yml
    secrets: inherit
  # ゲートと回答フォームの公開。差分で選ばず、master の先頭の実行が毎回公開する（ゲートを変えた push の公開が落ちても、
  # 次の push が公開し直す）。先頭でなくなった実行は、新しい版を上書きしないよう公開しない。
  deploy-gate:
    needs: [flow-gate]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # どの ref から起こしても本番（公開先）は1つなので、レーンの鍵は master に決めてある（レーンは docs/architecture/tech-stack.md「CIの実行枠」）。
    concurrency:
      group: master-lane-5
      queue: max
    strategy:
      max-parallel: 1
      matrix:
        command: [deploy, deploy --env form]
    steps:
      - uses: actions/checkout@v5
      - id: head
        run: '[ "$(git ls-remote origin refs/heads/master | cut -f1)" = "$GITHUB_SHA" ] && echo "latest=true" >> "$GITHUB_OUTPUT" || echo "master の先頭ではないので公開しない"'
      - if: steps.head.outputs.latest == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: tools/flow-gate
          command: ${{ matrix.command }}
