# frontend の単体テストの変異テスト（tasks#839）。src/ の実装を Stryker で1か所ずつ書き換え、書き換えごとに、それを通るテストを
# 最後まで回して、どのテストが落ちたかを記録し、backend と同じ表の形（Stryker の結果の JSON）と同じ台本で見直しの候補を出す
# （.claude/rules/testing-review.md「テストを変異テストで見直す」）。Stryker と口の直しは frontend/scripts/mutation/install.sh。
#
# - 毎月2日の 02:23（日本時間）に定期に起き、手でも起こせる（gh workflow run mutation-frontend.yml、または Actions → Mutation
#   frontend → Run workflow）。測る版と台本は、手で起こすときは選んだ ref、定期は master の先端から読む（台本は
#   frontend/scripts/mutation/ と backend/scripts/mutation/review.py）。version が版をコミットに1度だけ決め、どの段もそのコミットを
#   取り出す（本が始まる時刻は待ちでずれ、ref の名前を本ごとに読むと、本ごとに違う版を測って plan.mjs の分け方がずれる）。
# - 手で起こした測りは入力の issue のレーン、定期の測りはどの issue にも属さない専用のレーン（鍵 mutation）で動き、レーンより
#   多い本は空くまで待つ（レーンは docs/architecture/tech-stack.md「CIの実行枠」）。
# - 定期の測りが全部の本を回し終え、重なりの候補があれば、review が置き場へ候補を消すタスクを起こす
#   （backend/scripts/mutation/cleanup_issue.py。進め方は .claude/skills/test-review/SKILL.md「定期の測りから起きた消すタスク」）。
# - 2段で回る:
#   1. shard（16本）: 書き換えるファイルを行数がそろうように分け（plan.mjs）、1本ずつ別のランナーで Stryker を回す。mutate に
#      ファイルを渡すと、そのファイルだけを1本で回す（分けない）。
#   2. review（1本）: 1 を1つの表にし（report.mjs）、表から見直しの候補を出す（backend/scripts/mutation/review.py）。前の実行の
#      見直し（成果物 mutation-frontend-review）を取ってきて比べ、前回も重なりの候補だったテストに印を付ける。mutate で範囲を
#      絞った測りの見直しは、次の見直しの前回にしない（残さない）。
# - compare にファイル（frontend からのパス）を渡すと、1・2 の代わりに、そのファイルを vitest の口と command の口（書き換えごとに
#   テスト全体を回す。並び1本）で回して判定を突き合わせる（compare.mjs）。口の直しを外す・版を上げるときに使う。
# - 持ち時間: 8本に分けた試し（tasks#839）で、1本の書き換えは約1,400〜1,900件、Stryker の見込みで1本4時間ほどだった
#   （書き換えを通るテストが重いもの（画面全体のテスト）ほど遅い）。16本に分けて、ジョブの上限（6時間）より前に終える。
# - 成果物: 1 は mutation-frontend-shard-<番号>（14日）、2 は mutation-frontend-review（次の見直しが比べるので90日）。
name: Mutation frontend

on:
  schedule:
    # backend（mutation.yml）の翌日に回し、同時に動けるジョブの枠を取り合わない。毎時0分は混んで遅れるので外す。
    - cron: "23 2 2 * *"
      timezone: Asia/Tokyo
  workflow_dispatch:
    inputs:
      issue:
        description: この測りを持つ置き場の issue の番号（同時に動かすジョブの数をその issue のレーンで数える）
        required: true
      ref:
        description: 測る版（台本も同じ版から読む）
        required: true
        default: master
      mutate:
        description: 書き換えるファイル（frontend からのパスをカンマでつなぐ。Stryker の --mutate に渡す。空なら src/ の全部を16本に分ける）
        required: false
        default: ""
      compare:
        description: 2つの口の判定を突き合わせるファイル（frontend からのパス。空なら全部を測る）
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: mutation-frontend
  queue: max

env:
  SHARDS: 16

jobs:
  version:
    concurrency:
      group: ${{ inputs.issue && format('orch/tasks-{0}', inputs.issue) || 'mutation' }}-lane-1
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - id: sha
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref || github.sha }}
        run: echo "sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$REF" -q .sha)" >> "$GITHUB_OUTPUT"

  shard:
    needs: version
    if: inputs.compare == '' && inputs.mutate == ''
    concurrency:
      group: ${{ inputs.issue && format('orch/tasks-{0}', inputs.issue) || 'mutation' }}-lane-${{ matrix.lane }}
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        # 本をレーン 1〜5 へ順に振る。
        include:
          - { shard: 0, lane: 1 }
          - { shard: 1, lane: 2 }
          - { shard: 2, lane: 3 }
          - { shard: 3, lane: 4 }
          - { shard: 4, lane: 5 }
          - { shard: 5, lane: 1 }
          - { shard: 6, lane: 2 }
          - { shard: 7, lane: 3 }
          - { shard: 8, lane: 4 }
          - { shard: 9, lane: 5 }
          - { shard: 10, lane: 1 }
          - { shard: 11, lane: 2 }
          - { shard: 12, lane: 3 }
          - { shard: 13, lane: 4 }
          - { shard: 14, lane: 5 }
          - { shard: 15, lane: 1 }
    defaults: &frontend
      run:
        working-directory: frontend
    steps: &shard-steps
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: bash scripts/mutation/install.sh
      - name: 回す
        env:
          SHARD: ${{ matrix.shard }}
          MUTATE: ${{ inputs.mutate }}
        run: |
          files=${MUTATE:-$(node scripts/mutation/plan.mjs "$SHARD" "$SHARDS")}
          echo "この本で書き換えるファイル: $(echo "$files" | tr ',' '\n' | wc -l) 本"
          npx stryker run scripts/mutation/stryker.config.mjs --mutate "$files"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-frontend-shard-${{ matrix.shard }}
          path: frontend/reports/mutation/mutation.json
          retention-days: 14
          if-no-files-found: warn

  # mutate に名指したファイルだけを1本で回す（手順は shard と同じ）。matrix の行を exclude の式で外す形では、本が1本も作られない。
  file:
    needs: version
    if: inputs.compare == '' && inputs.mutate != ''
    concurrency:
      group: ${{ inputs.issue && format('orch/tasks-{0}', inputs.issue) || 'mutation' }}-lane-${{ matrix.lane }}
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      matrix:
        include:
          - { shard: 0, lane: 1 }
    defaults: *frontend
    steps: *shard-steps

  review:
    needs: [version, shard, file]
    if: ${{ !cancelled() && needs.version.result == 'success' && inputs.compare == '' }}
    concurrency:
      group: ${{ inputs.issue && format('orch/tasks-{0}', inputs.issue) || 'mutation' }}-lane-1
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: mutation-frontend-shard-*
          path: /tmp/art
      - name: 前の実行の見直しを取る
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/prev
          prev=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=mutation-frontend-review&per_page=30" \
            -q '[.artifacts[] | select(.expired | not) | select(.workflow_run.id != ${{ github.run_id }})][0].workflow_run.id // empty')
          if [ -n "$prev" ]; then
            gh run download "$prev" -R "${{ github.repository }}" -n mutation-frontend-review -D /tmp/prev
            echo "前の見直し: 実行 $prev"
          else
            echo "前の見直しは無い（前回も候補だった印は付かない）"
          fi
      - id: review
        name: 集計して見直す
        run: |
          mkdir -p /tmp/review
          node scripts/mutation/report.mjs /tmp/art /tmp/review/report.json
          python3 ../backend/scripts/mutation/review.py /tmp/review/report.json /tmp/prev /tmp/review
          cat /tmp/review/summary.md >> "$GITHUB_STEP_SUMMARY"
      - if: (inputs.mutate == '' && needs.shard.result || needs.file.result) != 'success'
        run: echo "落ちた本があり、書き換えが欠けているので、この見直しは次の見直しの前回にしない。" >> "$GITHUB_STEP_SUMMARY"
      - if: inputs.mutate != ''
        run: echo "範囲を絞った測り（mutate）なので、この見直しは次の見直しの前回にしない。" >> "$GITHUB_STEP_SUMMARY"
      # src/ の全部の書き換えを回し終えた測りの見直しだけを残す（本が落ちて欠けた測り・範囲を絞った測りを、次の見直しが前回として読まないように）。
      - if: steps.review.outputs.complete == 'true' && needs.shard.result == 'success' && inputs.mutate == ''
        uses: actions/upload-artifact@v7
        with:
          name: mutation-frontend-review
          path: /tmp/review/
          retention-days: 90
          if-no-files-found: warn
      # shell を名指すと pipefail が付き、起票が落ちたら tee の成功で隠さずに段を落とす。
      - name: 重なりの候補を消すタスクを起こす
        if: github.event_name == 'schedule' && steps.review.outputs.complete == 'true' && needs.shard.result == 'success'
        shell: bash
        env:
          FLOW_BOT_TOKEN: ${{ secrets.FLOW_BOT_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          size=$(cd ../backend/scripts/mutation && python3 cleanup_issue.py frontend /tmp/review "$RUN_URL" /tmp/cleanup.md)
          if [ -z "$size" ]; then echo "重なりの候補が無いので、消すタスクは起こさない。" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          node ../.claude/skills/file-issue/scripts/new-issue.mjs --type 保守 --body-file /tmp/cleanup.md --size "$size" --priority 低 \
            --title "テストの重なりを消す（frontend、$(TZ=Asia/Tokyo date +%Y-%m) の定期の測りから）" | tee -a "$GITHUB_STEP_SUMMARY"

  compare:
    needs: version
    if: inputs.compare != ''
    concurrency:
      group: ${{ inputs.issue && format('orch/tasks-{0}', inputs.issue) || 'mutation' }}-lane-1
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: bash scripts/mutation/install.sh
      - name: vitest の口で回す
        env:
          FILE: ${{ inputs.compare }}
        run: |
          npx stryker run scripts/mutation/stryker.config.mjs --mutate "$FILE"
          mkdir -p /tmp/compare && cp reports/mutation/mutation.json /tmp/compare/vitest.json
      # テスト全体は自分でスレッドを並べるので、書き換えを並べて回すと持ち時間を超える。
      - name: command の口で回す
        env:
          FILE: ${{ inputs.compare }}
        run: |
          npx stryker run scripts/mutation/stryker.config.mjs --mutate "$FILE" --testRunner command --coverageAnalysis off --concurrency 1
          cp reports/mutation/mutation.json /tmp/compare/command.json
      # shell を名指すと pipefail が付き、比べる台本が落ちたら tee の成功で隠さずに段を落とす。
      - name: 突き合わせる
        shell: bash
        run: node scripts/mutation/compare.mjs /tmp/compare/vitest.json /tmp/compare/command.json | tee -a "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-frontend-compare
          path: /tmp/compare/
          retention-days: 14
          if-no-files-found: warn
